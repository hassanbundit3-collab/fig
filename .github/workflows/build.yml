name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Check NoFigura jar exists
        run: ls libs/*.jar

      - name: Copy jar into project
        run: |
          mkdir -p nofigura-opaque-fix/libs
          cp libs/*.jar nofigura-opaque-fix/libs/

      - name: Build
        working-directory: nofigura-opaque-fix
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nofigura-opaque-fix
          path: |
            nofigura-opaque-fix/build/libs/*.jar
            !nofigura-opaque-fix/build/libs/*-sources.jar
